<p>Crested geckos are classified as Vulnerable on the <a href=https://www.iucnredlist.org/species/176173/123253756>ICUN Red List</a>.</p>
<p>The pet trade is detrimental to crested geckos' survival in the wild; do not support individuals selling "wild-caught" animals!</p>
